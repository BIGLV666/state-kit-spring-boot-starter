spring:
  autoconfigure:
    # auth-kit 自动装配需要 Redis（session 存储），测试环境无 Redis，排除之；
    # state-kit 只读取 AuthContext 静态上下文，不依赖 auth-kit 的任何 Bean。
    # R2dbcAutoConfiguration 会让 DataSourceAutoConfiguration 退避（ConnectionFactory 存在），
    # 测试型 JVM 的 classpath 有 r2dbc-h2，同样排除；Reactive 用例走独立 runner 显式装配
    exclude: io.github.biglv666.authkit.config.AuthKitAutoConfiguration,
             org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration,
             org.springframework.boot.autoconfigure.data.r2dbc.R2dbcDataAutoConfiguration,
             org.springframework.boot.autoconfigure.r2dbc.R2dbcTransactionManagerAutoConfiguration
  datasource:
    url: jdbc:h2:mem:statekit;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

state-kit:
  history:
    enabled: false
  operator: auto
  machines:
    # 主测试状态机：覆盖单源 / 多源 / 守卫 / 动作 / 冲突抛异常
    order:
      state-type: io.github.biglv666.statekit.testapp.OrderStatus
      id-type: java.lang.Long
      table: t_order
      status-column: status
      id-column: id
      conflict-strategy: throw
      transitions:
        - { from: CREATED, event: PAY, to: PAID }
        - { from: PAID, event: SHIP, to: SHIPPED, action: orderShipAction }
        - { from: [CREATED, PAID], event: CANCEL, to: CANCELLED, guard: cancelGuard }
        - { from: SHIPPED, event: SIGN, to: DONE, action: orderSignAction, guard: orderSignGuard }
    # 冲突策略 log 的状态机 + 自爆动作
    task:
      state-type: io.github.biglv666.statekit.testapp.TaskStatus
      table: t_task
      conflict-strategy: log
      transitions:
        - { from: NEW, event: RUN, to: RUNNING, action: boomAction }
        - { from: RUNNING, event: FINISH, to: FINISHED }
        - { from: [NEW, RUNNING], event: ABORT, to: ABORTED }
    # 同 event 多边（不同 from 不同 to）+ String 主键
    flow:
      state-type: io.github.biglv666.statekit.testapp.FlowStatus
      id-type: java.lang.String
      table: t_flow
      id-column: id
      transitions:
        - { from: A, event: GO, to: B }
        - { from: C, event: GO, to: D }
    # 0.2.0：乐观锁双保险
    orderv:
      state-type: io.github.biglv666.statekit.testapp.OrderStatus
      table: t_orderv
      version-column: version
      transitions:
        - { from: CREATED, event: PAY, to: PAID }
    # 0.2.0：冲突自动重试（GO 从 A→B、B→D，重试以最新状态重解析路由）
    retryFlow:
      state-type: io.github.biglv666.statekit.testapp.FlowStatus
      table: t_retry
      conflict-strategy: throw
      retry:
        max-attempts: 3
        backoff-ms: 200
      transitions:
        - { from: A, event: GO, to: B }
        - { from: B, event: GO, to: D }
    # 0.3.0：补偿策略（GO: A→B、B→D，并发推进后按策略决策去向）
    compFlow:
      state-type: io.github.biglv666.statekit.testapp.FlowStatus
      table: t_comp
      conflict-strategy: throw
      compensation: compFlowPolicy
      transitions:
        - { from: A, event: GO, to: B }
        - { from: B, event: GO, to: D }
        - { from: A, event: FAST, to: C }
    # 0.2.0：嵌套子状态机（会签 ALL）
    wf:
      state-type: io.github.biglv666.statekit.testapp.WorkflowStatus
      table: t_wf
      transitions:
        - { from: NEW, event: START, to: REVIEWING }
        - { from: REVIEWING, event: ALL_OK, to: APPROVED }
    wfItem:
      state-type: io.github.biglv666.statekit.testapp.ItemStatus
      table: t_wf_item
      sub:
        parent: wf
        parent-state: REVIEWING
        group-column: workflow_id
        strategy: all
        on-complete-event: ALL_OK
      transitions:
        - { from: PENDING, event: OK, to: DONE }
